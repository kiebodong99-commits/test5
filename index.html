<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinner Proposal for Cheryl 💕</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(to bottom right, #fff7fa, #ffa1c6);
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
    }

    h1 {
        color: #ff4d88;
        margin-bottom: 35px;
    }

    .buttons {
        display: flex;
        gap: 20px;
        position: relative;
    }

    button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s ease;
        position: relative;
    }

    #yesBtn {
        background-color: #4CAF50;
        color: white;
    }

    #noBtn {
        background-color: #ff4d4d;
        color: white;
    }

    /* Pink ribbon banner */
    #loveRibbon {
        position: fixed;
        top: 50px;
        background: linear-gradient(45deg, #ff66a3, #ff99cc);
        padding: 15px 40px;
        border-radius: 50px;
        color: white;
        font-weight: bold;
        font-size: 20px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        display: none;
        animation: pop 0.6s ease;
        z-index: 10;
    }

    #loveRibbon img {
        width: 50px;
        vertical-align: middle;
        margin-left: 10px;
    }

    #bunnyContainer {
        margin-top: 40px;
        display: none;
        animation: pop 0.5s ease;
    }

    #bunnyContainer img {
        width: 200px;
    }

    #bunnyText {
        font-size: 18px;
        margin-top: 10px;
        color: #ff66a3;
        font-weight: bold;
    }

    @keyframes pop {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
    }
        /* Ending screen */
    #endingScreen {
        position: fixed;
        inset: 0;
        background: linear-gradient(45deg, #ff99cc, #ff6bb5);
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 30px;
        font-weight: bold;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease;
        z-index: 5;
    }
</style>
</head>

<body>

<h1>CHERYLLLL <br>Let's have a dinner together tonight?</h1>

<div class="buttons" id="buttonArea">
    <button id="yesBtn">YES!!!🤪 </button>
    <button id="noBtn">NO🙈 </button>
</div>

<!-- Ribbon Message -->
<div id="loveRibbon">
    I know you would like to... Adek! 😝
</div>

<div id="bunnyContainer">
    <img id="randomGif" src="">
    <div id="bunnyText"></div>
</div>

<div id="endingScreen">
    Yeay! See you soon Adeekkk!!! 💕
</div>    

<audio id="bgMusic" src="keepyouasafe.mp3" loop> bgMusic.volume = 0.4
</audio>

<script>
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const bunnyContainer = document.getElementById("bunnyContainer");
    const bunnyText = document.getElementById("bunnyText");
    const randomGif = document.getElementById("randomGif");
    const loveRibbon = document.getElementById("loveRibbon");
    const bgMusic = document.getElementById("bgMusic");

    let yesScale = 1;
    let noScale = 1;
    let musicStarted = false;

    const gifs = [
        "https://media.giphy.com/media/Ev477g37MJORyOWfdG/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbHVxOHJleWZsemNsY3BibXE1dnBuNms5anJqY3RlZmk2dnZjeThyNiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wvYNSqBAMDVx8CEYkt/giphy.gif",
        "https://media.giphy.com/media/901mxGLGQN2PyCQpoc/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdXBkd2N4aDduc2U1bGt6OG5jbXV0YnhsZng0ZHV1bjR1a29sZnJmaiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/xinkUUmE1ww5mbOd8E/giphy.gif",
        "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHcyeTZwdzdiYWFybXhvcGJqZHAybnUwYTBuMGRkZGhucnppazJtZiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/OHRF8LZis06OiPDJby/giphy.gif"
    ];

    const messages = [
        "Are you sureeee, pretty?",
        "What if I promise extra giggles?",
        "But I already practiced my charming smile.",
        "Can I trade one smile for one meal?",
        "What if it’s the yummiest yes ever?",
        "Just food… and my adorable company?",
        "Okay okay… but what if I say PRETTTYYYY please?"
    ];

    let messageIndex = 0;

    function startMusic() {
        if (!musicStarted) {
            bgMusic.play().catch(() => {});
            musicStarted = true;
        }
    }

    // YES BUTTON
    yesBtn.addEventListener("click", () => {
    startMusic();
    loveRibbon.style.display = "block";

    // Show ending screen after short delay
    setTimeout(() => {
        const endingScreen = document.getElementById("endingScreen");
        endingScreen.style.opacity = "1";
        endingScreen.style.pointerEvents = "auto";
    }, 1500); // appears after 1.5s
});

    // NO BUTTON
    noBtn.addEventListener("click", () => {
        startMusic();

        // Resize
        yesScale *= 1.25;
        noScale *= 0.80;

        yesBtn.style.transform = `scale(${yesScale})`;
        noBtn.style.transform = `scale(${noScale})`;

        // Move randomly but stay visible
        const maxX = window.innerWidth - 100;
        const maxY = window.innerHeight - 100;

        const randomX = Math.random() * maxX;
        const randomY = Math.random() * maxY;

        noBtn.style.position = "fixed";
        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";

        // Random GIF
        const randomIndex = Math.floor(Math.random() * gifs.length);
        randomGif.src = gifs[randomIndex];

        // Message
        bunnyText.textContent = messages[messageIndex];
        messageIndex = (messageIndex + 1) % messages.length;

        bunnyContainer.style.display = "block";
    });
</script>

</body>
</html>
